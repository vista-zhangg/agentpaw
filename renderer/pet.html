<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: agentpaw-asset:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="pet.css" />
    <link rel="stylesheet" href="quota-card.css" />
    <link rel="stylesheet" href="popovers.css" />
    <link rel="stylesheet" href="capsule.css" />
    <title>AgentPaw</title>
  </head>
  <body>
    <div id="stage">
      <!-- 气泡播报 -->
      <div id="bubble" class="bubble hidden">
        <span id="bubble-text"></span>
      </div>

      <!-- 需要输入 / 授权卡片：Claude 要选择/授权/输入时在这处理 -->
      <section id="rest-reminder" class="rest-card hidden" role="region" aria-labelledby="rest-title">
        <div class="rest-card-top">
          <span id="rest-card-mark" class="rest-card-mark" aria-hidden="true"></span>
          <div class="rest-card-text">
            <div id="rest-title" class="rest-card-title" aria-live="polite"></div>
            <p id="rest-message" class="rest-card-message"></p>
          </div>
        </div>
        <div class="rest-card-actions"><button id="rest-done" type="button" class="rest-primary" data-l10n="完成啦">Done</button><button id="rest-snooze" type="button" data-l10n="10 分钟后">In 10 minutes</button><button id="rest-skip" type="button" data-l10n="今天跳过">Skip today</button></div>
        <p id="rest-action-status" class="rest-action-status" role="status"></p>
      </section>
      <div id="ask" class="ask hidden" role="dialog" aria-live="polite" aria-labelledby="ask-label">
        <div class="ask-head">
          <div class="ask-label" id="ask-label" data-i18n="ask.needsInput" data-l10n="需要输入">Input required</div>
          <span class="ask-queue" id="ask-queue"></span>
          <div class="ask-sess" id="ask-sess"></div>
        </div>
        <div class="ask-scroll" id="ask-scroll">
          <div class="ask-card">
            <div class="ask-qhead" id="ask-qhead"></div>
            <div class="ask-q" id="ask-q"></div>
            <div class="ask-hint" id="ask-hint"></div>
            <div class="ask-opts" id="ask-opts"></div>
            <div class="ask-other hidden" id="ask-input-row">
              <input id="ask-text" type="text" aria-label="Custom answer or feedback" data-l10n-aria-label="自定义回答或修改意见" data-i18n-ph="ask.placeholder" placeholder="Type a custom answer…" data-l10n-placeholder="输入自定义回答…" />
            </div>
          </div>
        </div>
        <div class="ask-toolbar">
          <div class="ask-page" id="ask-page"></div>
          <div class="ask-foot" id="ask-foot">
            <button class="ask-btn" id="ask-back" data-i18n="ask.back" data-l10n="返回">Back</button>
            <button class="ask-btn primary" id="ask-submit" data-i18n="ask.submit" data-l10n="提交回答">Submit answer</button>
          </div>
          <button class="ask-term" id="ask-term" data-i18n="ask.goTerminal" data-l10n="在终端处理">Handle in terminal</button>
        </div>
      </div>

      <!-- 思考指示器（thinking 状态：填补 Claude 在想、没输出的空档） -->
      <div id="think" class="think">
        <span class="td">💭</span>
        <span class="think-label" data-i18n="state.thinking" data-l10n="思考中">Thinking</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>

      <!-- 睡觉指示器（逐渐变大往上飘的 z z Z，醒目） -->
      <div id="sleep" class="sleep">
        <span class="z z1">z</span>
        <span class="z z2">z</span>
        <span class="z z3">Z</span>
      </div>


      <!-- 按工具动作时头顶飘出的道具 emoji -->
      <div id="prop" class="prop"></div>
      <div id="sidekick" class="sidekick"><img src="../assets/salary-cat.png" alt="" aria-hidden="true" /></div>

      <!-- Codex 额度：点击胶囊上的 5h / 7d 打开，与详情面板同一张额度卡 -->
      <div id="quota-popover" class="quota-popover pop hidden" role="dialog" aria-labelledby="quota-popover-title">
        <div class="pop-head">
          <div class="quota-popover-heading">
            <div id="quota-popover-title" class="pop-title" data-l10n="Codex 额度">Codex quota</div>
            <div id="quota-popover-status" class="pop-sub"></div>
          </div>
          <button id="quota-popover-close" class="icon-btn" type="button" aria-label="Close" data-l10n-aria-label="关闭"></button>
        </div>
        <div class="pop-body">
          <div id="quota-popover-rows" class="quota-grid"></div>
          <div id="quota-popover-insight" class="quota-estimate" hidden></div>
        </div>
        <div class="pop-foot">
          <button id="quota-popover-panel" class="linkbtn" type="button"><span class="oi" id="quota-popover-panel-icon" aria-hidden="true"></span><span data-l10n="在详情面板看用量">View usage in Details</span></button>
        </div>
      </div>

      <div id="compact-row" class="compact-row">
        <!-- 多会话状态点：每个点 = 一个并行任务，颜色 = 状态 -->
        <div id="sessions" class="sessions"></div>

        <!-- 唯一形象：打工猫（每个状态一张 GIF，动效由 GIF 自带） -->
        <div id="cat" class="cat idle" role="button" tabindex="0" aria-label="AgentPaw: open current status; right-click for menu" data-l10n-aria-label="AgentPaw：打开当前状态；右键打开菜单">
          <img id="cat-img" src="../assets/salary-cat.png" alt="cat" draggable="false" />
        </div>

        <!-- 常驻今日用量条；额度区域是唯一的订阅详情入口，默认不弹系统 tooltip -->
        <div id="chip" class="chip" aria-live="polite" aria-label="AgentPaw status" data-l10n-aria-label="AgentPaw状态">
          <span id="chip-context" class="chip-context" data-l10n="🐾 待命">🐾 Standing by</span>
          <span id="chip-quota" class="chip-quota" role="button" tabindex="0" aria-controls="quota-popover" aria-expanded="false" aria-label="View quota reset times" data-l10n-aria-label="查看订阅额度刷新时间" hidden></span>
          <span id="chip-tokens-sep" class="chip-sep">·</span>
          <span id="chip-tokens" class="chip-tokens">0 tokens</span>
          <span id="chip-cost-sep" class="chip-sep">·</span>
          <span id="chip-cost" class="chip-cost">$0.000</span>
          <button id="rest-pending" class="rest-pending" type="button" hidden data-l10n="♡ 休息一下">♡ Take a break</button>
          <!-- 需要你处理的数量：只在有事项时出现，点开快速视图。 -->
          <div id="notepad" class="notepad hidden" role="button" tabindex="0" aria-label="Quick view" data-l10n-aria-label="快速视图">
            <span id="np-badge" class="np-badge"></span>
          </div>
        </div>
      </div>

      <!-- 快速视图：左键点伙伴打开；需要你、进行中、最近会话与近 7 天记录 -->
      <div id="action-pop" class="action-pop pop hidden" role="dialog" aria-labelledby="qv-title">
        <div class="pop-head">
          <span id="qv-title" class="visually-hidden" data-l10n="快速视图">Quick view</span>
          <div id="qv-summary" class="qv-summary"></div>
          <button id="ac-settings" class="icon-btn" type="button" title="Settings" data-l10n-title="设置" aria-label="Settings" data-l10n-aria-label="设置"></button>
          <button id="ac-close" class="icon-btn" type="button" title="Close" data-l10n-title="关闭" aria-label="Close" data-l10n-aria-label="关闭"></button>
        </div>
        <div class="ac-scroll pop-body">
          <div id="qv-today" class="qv-today"></div>
          <section id="ac-act-sec" class="qv-sec" hidden>
            <div class="sec-t"><span data-l10n="需要你">Needs you</span><span id="qv-need-count" class="n"></span></div>
            <div id="ac-acts" class="qv-acts"></div>
            <p id="ac-empty" class="qv-empty" hidden></p>
          </section>
          <section id="ac-sessions-sec" class="qv-sec">
            <div class="sec-t"><span id="qv-sessions-title" data-l10n="进行中">In progress</span><span id="qv-sessions-count" class="n"></span></div>
            <div id="ac-session-list" class="card list"></div>
          </section>
          <section id="ac-others-sec" class="qv-sec" hidden>
            <div class="sec-t"><span data-l10n="最近会话">Recent sessions</span></div>
            <div id="ac-other-list" class="card list"></div>
          </section>
          <section id="ac-recent-sec" class="qv-sec">
            <button id="ac-recent-toggle" class="qv-recent" type="button" aria-expanded="false" aria-controls="ac-recent-body"></button>
            <div id="ac-recent-body" hidden>
              <div id="ac-recent-list" class="card list"></div>
              <button id="ac-clear-recent" class="linkbtn" type="button" data-l10n="清空记录">Clear history</button>
            </div>
          </section>
        </div>
        <div id="ac-status" class="ac-status" role="status" aria-live="polite"></div>
        <div class="pop-foot">
          <button id="ac-panel" class="btn sm" type="button"><span class="oi" id="ac-panel-icon" aria-hidden="true"></span><span data-l10n="详情面板">Details</span></button>
          <span id="qv-shortcut" class="pop-meta"></span>
        </div>
      </div>
    </div>

    <script src="../shared/messages.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="language.js"></script>
    <script src="../shared/states.js"></script>
    <script src="../shared/pet-assets.js"></script>
    <script src="../shared/agents.js"></script>
    <script src="../shared/pet-insights.js"></script>
    <script src="icons.js"></script>
    <script src="quota-card.js"></script>
    <script src="../shared/pet-geometry.js"></script>
    <script src="pet.js"></script>
    <script src="quick-view.js"></script>
    <script src="companion.js"></script>
  </body>
</html>
